server.port=8080

spring.application.name=feed-ranking

# ---- EDIT THESE FOR YOUR LOCAL POSTGRES SETUP ----
spring.datasource.url=jdbc:postgresql://localhost:5432/feed_ranking_db
spring.datasource.username=********
spring.datasource.password=********
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=15

# schema is created manually via schema.sql (see setup instructions) --
# "validate" makes Hibernate check entities match the DB schema on startup
# instead of trying to generate/alter it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=100

spring.sql.init.mode=never

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.api-docs.path=/v3/api-docs

# ---- Feed algorithm tuning - all configurable without touching code ----
feed.celebrity-threshold=10000
feed.cache.max-size-per-user=500
feed.ranking.top-n=20
feed.ranking.decay-lambda=0.08
feed.ranking.like-weight=0.6
feed.ranking.comment-weight=1.2
feed.ranking.affinity-weight=5.0
feed.async.core-pool-size=4
feed.async.max-pool-size=8
feed.async.queue-capacity=1000
